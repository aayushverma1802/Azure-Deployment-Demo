name: Build and deploy Python app to Azure Web App - ggk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies into Azure package directory
        run: |
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ggk'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C4BF2FC6C23C4B99A34A9ADD224F1104 }}
          startup-command: "PYTHONPATH=/home/site/wwwroot/.python_packages/lib/site-packages gunicorn --worker-class uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 --workers 1 --timeout 600 --access-logfile - --error-logfile - app:app"